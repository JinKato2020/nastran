<main class="comparison-main"><div class="comparison-context"><a href="index.html#home">教材</a><span>共通の解析技術論</span></div><h1 class="comparison-page-title">似たカードの使い分け</h1><label class="comparison-picker" for="comparison-picker"><span>比較テーマ <small id="comparison-count"></small></span><select id="comparison-picker" aria-label="比較テーマ"></select></label><article id="comparison-detail"></article><template id="worked-rigid-interpolation" data-title="検算 · 3本のばねの荷重分担"><p>3本のばねを等間隔に置き、右の1本だけを4倍の剛さにします。中央に荷重Pを加え、力とモーメントの釣合いで各ばねの力を求めます。</p><figure class="element-figure"><svg viewBox="0 0 380 200" role="img" aria-label="3つのばねの上に剛な棒。左と中央のばね定数k、右は4k。中央に荷重P。RBE2では棒がまっすぐ傾き、RBE3では各点がばらばらに沈む">
<g font-size="12" fill="#29466b"><text x="20" y="20">RBE2：足先は一直線（剛）</text><text x="210" y="20">RBE3：足先はばらばら</text></g>

</svg><figcaption>間隔1で並んだ3本のばね（k、k、4k）の上に、中央の点から荷重 P を配る。下の赤字が各ばねの受ける力。この計算では、ばねの剛性と、等しいRBE3の重みを用いて配分を比べます。</figcaption></figure><div class="element-formula">【RBE2】足先は剛な棒の上 → w = a + b·x（x = −1, 0, +1）
　力のつり合い：k(a − b) + k·a + 4k(a + b) = P
　モーメントのつり合い：−k(a − b) + 4k(a + b) = 0　→　b = −0.6a
　→ a = P/(4.2k) ≈ 0.238 P/k、各ばねの力 0.381P、0.238P、0.381P
【RBE3（重み全て1）】この配置で中心に加えた荷重は等分される → P/3 = 0.333P ずつ
　各点の沈み：0.333、0.333、0.083（× P/k）→ 一直線に並ばない
　参照点の沈み（平均の当てはめ、x = 0）：(0.333 + 0.333 + 0.083)/3 = 0.250 P/k</div><p>この条件での中心変位はRBE2で0.238 P/k、RBE3で0.250 P/kです。RBE2では3点が一直線に並ぶため、剛性の違いが荷重配分に表れます。</p></template></main>
