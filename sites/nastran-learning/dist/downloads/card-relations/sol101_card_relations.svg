class="rel-node"><title>GRID — 節点1</title><rect x="566" y="968" width="232.5" height="96" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="576" y="985" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="576" y="1008" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">GRID</text><text x="576" y="1031" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">ID = 1</text><text x="576" y="1051" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">節点1</text></g><g  class="rel-node"><title>GRID — 節点2</title><rect x="816.5" y="968" width="232.5" height="96" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="826.5" y="985" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="826.5" y="1008" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">GRID</text><text x="826.5" y="1031" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">ID = 2</text><text x="826.5" y="1051" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">節点2</text></g></g><text x="14" y="1288" font-size="12" fill="#516d8f" font-weight="400" text-anchor="start">実線：番号で参照する先 ／ 破線：設定として作用</text><text x="14" y="1315" font-size="12" fill="#6b7f97" font-weight="400" text-anchor="start">図は教材の固定例。カードの再掲は同じデータ。矢印はファイルの記述順や力の伝わる向きではありません。</text><rect x="14" y="1349" width="1052" height="178" rx="9" fill="#f5f0fa"/><text x="28" y="1377" font-size="16" fill="#71518f" font-weight="600" text-anchor="start">番号の参照とは別の設定・出力要求</text><text x="28" y="1406" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">Executive：SOL 101 → CEND</text><text x="28" y="1434" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">Caseの結果要求：DISPLACEMENT / SPCFORCES / FORCE / STRESS = ALL</text><text x="28" y="1462" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">PARAM POST=1は入力教材の任意設定。OP2の出力方式を指定します。</text><text x="28" y="1490" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">CaseのFORCE = ALLは要素力の出力要求。BulkのFORCEは加える荷重です。</text></svg>