<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1226" width="1080" height="1226" class="relations-svg" role="group" aria-label="SOL 103 実固有値解析のカード相関図" style="font-family:'Yu Gothic UI','Meiryo',sans-serif"><defs><marker id="rel-arrow-103" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7192b6"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="14" y="31" font-size="28" fill="#203e66" font-weight="650" text-anchor="start">SOL 103 · 実固有値解析</text><text x="14" y="59" font-size="15" fill="#7185a1" font-weight="400" text-anchor="start">解析カードの相関図</text><rect x="14" y="78" width="1052" height="40" rx="7" fill="#203e66"/><text x="26" y="104" font-size="17" fill="#fff" font-weight="500" text-anchor="start">Executive：SOL 103　→　CEND</text><g data-panel="0"><rect x="14" y="138" width="517" height="381" rx="12" fill="#f6f8fc" stroke="#d7e1ee"/><text x="30" y="168" font-size="17" fill="#24446b" font-weight="600" text-anchor="start">1. モードを求める条件</text><text x="30" y="195" font-size="12" fill="#627c99" font-weight="400" text-anchor="start">METHODはEIGRLの番号を選ぶ。</text><g data-edge="0:method:eigrl" class="rel-edge"><path d="M272.5 293V322H272.5V346" stroke="#7192b6" stroke-width="1.7" fill="none"  marker-end="url(#rel-arrow-103)"/><rect x="240.7" y="320" width="63.6" height="18" rx="4" fill="#f6f8fc"/><text x="272.5" y="332" font-size="11" fill="#46688f" font-weight="500" text-anchor="middle">30 = SID</text></g><g  class="rel-node"><title>METHOD = 30 — 固有値計算の条件を選択</title><rect x="31" y="213" width="483" height="80" rx="8" fill="#e8efff" stroke="#3658b6" stroke-width="1.3"/><text x="41" y="230" font-size="10" fill="#3658b6" font-weight="400" text-anchor="start">Case Control</text><text x="41" y="253" font-size="18" fill="#3658b6" font-weight="650" text-anchor="start">METHOD = 30</text><text x="41" y="280" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">固有値計算の条件を選択</text></g><g  class="rel-node"><title>EIGRL — 固有モードを1個探す</title><rect x="31" y="351" width="483" height="144" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="41" y="368" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="41" y="391" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">EIGRL</text><text x="41" y="414" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">SID = 30</text><text x="41" y="430" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">ND = 1</text><text x="41" y="446" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">V1 = 0.</text><text x="41" y="462" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">V2 = 100.</text><text x="41" y="482" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">固有モードを1個探す</text></g></g><g data-panel="1"><rect x="549" y="138" width="517" height="519" rx="12" fill="#f6f8fc" stroke="#d7e1ee"/><text x="565" y="168" font-size="17" fill="#24446b" font-weight="600" text-anchor="start">2. 拘束を選ぶ</text><text x="565" y="195" font-size="12" fill="#627c99" font-weight="400" text-anchor="start">X以外の動きを止める。</text><g data-edge="1:spc:spc1" class="rel-edge"><path d="M807.5 293V322H807.5V346" stroke="#7192b6" stroke-width="1.7" fill="none"  marker-end="url(#rel-arrow-103)"/><rect x="775.7" y="320" width="63.6" height="18" rx="4" fill="#f6f8fc"/><text x="807.5" y="332" font-size="11" fill="#46688f" font-weight="500" text-anchor="middle">10 = SID</text></g><g data-edge="1:spc1:grid1" class="rel-edge"><path d="M807.5 479V508H807.5V532" stroke="#7192b6" stroke-width="1.7" fill="none"  marker-end="url(#rel-arrow-103)"/><rect x="766.4" y="506" width="82.2" height="18" rx="4" fill="#f6f8fc"/><text x="807.5" y="518" font-size="11" fill="#46688f" font-weight="500" text-anchor="middle">G1 = ID = 1</text></g><g  class="rel-node"><title>SPC = 10 — 拘束セットを選択</title><rect x="566" y="213" width="483" height="80" rx="8" fill="#e8efff" stroke="#3658b6" stroke-width="1.3"/><text x="576" y="230" font-size="10" fill="#3658b6" font-weight="400" text-anchor="start">Case Control</text><text x="576" y="253" font-size="18" fill="#3658b6" font-weight="650" text-anchor="start">SPC = 10</text><text x="576" y="280" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">拘束セットを選択</text></g><g  class="rel-node"><title>SPC1 — 止める方向と節点</title><rect x="566" y="351" width="483" height="128" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="576" y="368" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="576" y="391" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">SPC1</text><text x="576" y="414" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">SID = 10</text><text x="576" y="430" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">C = 23456</text><text x="576" y="446" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">G1 = 1</text><text x="576" y="466" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">止める方向と節点</text></g><g  class="rel-node"><title>GRID — 節点1</title><rect x="566" y="537" width="483" height="96" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="576" y="554" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="576" y="577" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">GRID</text><text x="576" y="600" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">ID = 1</text><text x="576" y="620" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">節点1</text></g></g><g data-panel="2"><rect x="14" y="537" width="517" height="429" rx="12" fill="#f6f8fc" stroke="#d7e1ee"/><text x="30" y="567" font-size="17" fill="#24446b" font-weight="600" text-anchor="start">3. ばねと質量を節点へつなぐ</text><text x="30" y="594" font-size="12" fill="#627c99" font-weight="400" text-anchor="start">G2=0は固定側。GRID 0は作らない。</text><g data-edge="2:spring:grid1" class="rel-edge"><path d="M147.25 788V817H272.5V841" stroke="#7192b6" stroke-width="1.7" fill="none"  marker-end="url(#rel-arrow-103)"/><rect x="121.65" y="798" width="51.2" height="18" rx="4" fill="#f6f8fc"/><text x="147.25" y="810" font-size="11" fill="#46688f" font-weight="500" text-anchor="middle">G1 = 1</text></g><g data-edge="2:mass:grid1" class="rel-edge"><path d="M397.75 788V817H272.5V841" stroke="#7192b6" stroke-width="1.7" fill="none"  marker-end="url(#rel-arrow-103)"/><rect x="375.25" y="798" width="45" height="18" rx="4" fill="#f6f8fc"/><text x="397.75" y="810" font-size="11" fill="#46688f" font-weight="500" text-anchor="middle">G = 1</text></g><g  class="rel-node"><title>CELAS2 — X方向のばね</title><rect x="31" y="612" width="232.5" height="176" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="41" y="629" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="41" y="652" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">CELAS2</text><text x="41" y="675" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">EID = 100</text><text x="41" y="691" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">K = 100.</text><text x="41" y="707" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">G1 = 1</text><text x="41" y="723" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">C1 = 1</text><text x="41" y="739" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">G2 = 0</text><text x="41" y="755" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">C2 = 0</text><text x="41" y="775" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">X方向のばね</text></g><g  class="rel-node"><title>CONM2 — 節点1の集中質量</title><rect x="281.5" y="612" width="232.5" height="176" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="291.5" y="629" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="291.5" y="652" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">CONM2</text><text x="291.5" y="675" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">EID = 200</text><text x="291.5" y="691" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">G = 1</text><text x="291.5" y="707" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">M = 0.01</text><text x="291.5" y="727" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">節点1の集中質量</text></g><g  class="rel-node"><title>GRID — 節点1</title><rect x="31" y="846" width="483" height="96" rx="8" fill="#ffffff" stroke="#526d8c" stroke-width="1.3"/><text x="41" y="863" font-size="10" fill="#526d8c" font-weight="400" text-anchor="start">Bulk Data</text><text x="41" y="886" font-size="18" fill="#526d8c" font-weight="650" text-anchor="start">GRID</text><text x="41" y="909" font-size="12" fill="#3e5a7b" font-weight="400" text-anchor="start">ID = 1</text><text x="41" y="929" font-size="12" fill="#5e7590" font-weight="400" text-anchor="start">節点1</text></g></g><text x="14" y="996" font-size="12" fill="#516d8f" font-weight="400" text-anchor="start">実線：番号で参照する先 ／ 破線：設定として作用</text><text x="14" y="1023" font-size="12" fill="#6b7f97" font-weight="400" text-anchor="start">図は教材の固定例。カードの再掲は同じデータ。矢印はファイルの記述順や力の伝わる向きではありません。</text><rect x="14" y="1057" width="1052" height="150" rx="9" fill="#f5f0fa"/><text x="28" y="1085" font-size="16" fill="#71518f" font-weight="600" text-anchor="start">番号の参照とは別の設定・出力要求</text><text x="28" y="1114" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">Executive：SOL 103 → CEND</text><text x="28" y="1142" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">Caseの結果要求：DISPLACEMENT = ALL（固有モードの形）</text><text x="28" y="1170" font-size="12" fill="#5f5274" font-weight="400" text-anchor="start">PARAM POST=-1はOP2の出力方式を指定。番号でカードを選ぶ命令ではありません。</text></svg>